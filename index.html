<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Solyra – Yazarın Dünyası</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf6ef;--card:#fff;--tx:#2a2230;--mu:#7a6f82;--ac:#7a45e0;--ac2:#d98a5f;--bd:#e6dccb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15101c;--card:#201a2b;--tx:#efe9f5;--mu:#a99bb8;--ac:#b794ff;--ac2:#f0a67a;--bd:#33293f}}
:root[data-theme="dark"]{--bg:#15101c;--card:#201a2b;--tx:#efe9f5;--mu:#a99bb8;--ac:#b794ff;--ac2:#f0a67a;--bd:#33293f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 Inter,system-ui,sans-serif}
.w{max-width:860px;margin:0 auto;padding:20px 18px 90px}
h1,h2,h3,.ser{font-family:"Cormorant Garamond",Georgia,serif}
h2{font-size:30px;margin:36px 0 14px}
.hero{text-align:center;padding:56px 20px 44px;border-radius:0 0 32px 32px;background:radial-gradient(circle at 30% 20%,color-mix(in srgb,var(--ac) 35%,transparent),transparent 60%),radial-gradient(circle at 80% 80%,color-mix(in srgb,var(--ac2) 30%,transparent),transparent 55%)}
.logo{width:96px;height:96px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;font-size:44px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff}
.hero h1{font-size:54px;margin:0;letter-spacing:2px}.hero p{max-width:520px;margin:10px auto;color:var(--mu)}
.tags span{display:inline-block;border:1px solid var(--bd);border-radius:20px;padding:2px 12px;margin:3px;font-size:13px;color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px}
.bk{cursor:pointer}.cover{aspect-ratio:2/3;border-radius:6px 12px 12px 6px;display:flex;align-items:flex-end;padding:12px;color:#fff;font-family:"Cormorant Garamond",serif;font-weight:700;font-size:21px;line-height:1.1;box-shadow:-4px 6px 16px rgba(0,0,0,.25);border-left:5px solid rgba(0,0,0,.25)}
.bk small{display:block;margin-top:8px;color:var(--mu)}.st{font-size:12px;padding:1px 9px;border-radius:12px;background:var(--ac);color:#fff}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:8px 14px;font:inherit;cursor:pointer}.btn.p{background:var(--ac);color:#fff;border:0}
.back{background:none;border:0;color:var(--ac);font:inherit;cursor:pointer;padding:0;margin-bottom:10px}
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.fc{perspective:900px;height:230px;cursor:pointer}.fi{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}.fc.on .fi{transform:rotateY(180deg)}
.fa,.fb{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:12px;overflow:auto}
.fa{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;color:#fff;text-align:center;font-family:"Cormorant Garamond",serif;font-size:22px;font-weight:700}.fa i{font-style:normal;font-size:64px;margin-bottom:auto;margin-top:20px}
.fb{transform:rotateY(180deg);background:var(--card);border:1px solid var(--ac);font-size:13px;line-height:1.45}.fb b{color:var(--ac)}
.ch{display:flex;gap:12px;align-items:center;cursor:pointer}.ch .n{font:700 26px "Cormorant Garamond",serif;color:var(--ac);min-width:34px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 18px}
#txt p{margin:0 0 1.1em}
.q{border-left:3px solid var(--ac2);padding-left:10px;color:var(--mu);font-style:italic;margin:4px 0}
#sel{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:none;z-index:5}
#sel input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;margin:8px 0}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:20px;display:none;z-index:9;font-size:14px}
</style></head><body>
<div id="app"></div>
<div id="sel"><div class="q" id="sq"></div><input id="si" placeholder="Bu kısım hakkında yorumun…"><button class="btn p" id="sg">Gönder</button> <button class="btn" id="sx">Kapat</button></div>
<div id="toast"></div>
<script>
const B=[
{id:1,t:"Gece Yarısı Mührü",g:"Fantastik",s:"Devam ediyor",c:"#4b2fa0,#d98a5f",d:"Örnek tanıtım yazısı: Mühürlü bir şehirde, her gece yarısı kaybolan bir kapının peşine düşen genç bir kâtibin hikâyesi.",
ch:[{n:"Aylin",a:19,k:"Meraklı, inatçı",r:"Baş karakter",e:"🦊",c:"#c0562f,#f0a67a"},{n:"Kael",a:27,k:"Gizemli, sadık",r:"Rehber",e:"🐺",c:"#2f4f8f,#6fa8dc"},{n:"Mira",a:15,k:"Neşeli, cesur",r:"Yardımcı",e:"🕊️",c:"#3f8f6a,#9fd8b8"}],
p:[{t:"Kapının Gölgesi",o:1,x:["Şehir uyurken saat kulesi on iki kez çaldı. Aylin pencereden dışarı baktığında sokağın ortasında, geçen gün orada olmayan bir kapı gördü.","Kapı usulca aralandı. İçeriden gelen ışık, kaldırım taşlarına altın bir harita çizdi.","Gitmemesi gerektiğini biliyordu. Ama bilmek ile yapmak arasındaki mesafe, o gece çok kısaydı."]},{t:"Mühürlü Sokak",o:1,x:["Sabah olduğunda kapı yoktu. Yalnızca duvarda silik bir mühür kalmıştı.","Kael, mührü parmağıyla izleyip fısıldadı: “Seni de seçmiş.”"]},{t:"Taslak bölüm",o:0,x:["Bu bölüm henüz yayımlanmadı."]}]},
{id:2,t:"Yıldız Tozu",g:"Macera",s:"Yakında",c:"#0f6a7a,#f0d36f",d:"Çok yakında.",ch:[],p:[]},
{id:3,t:"Sessiz Liman",g:"Dram",s:"Tamamlandı",c:"#8a2f4f,#e6a0b0",d:"Örnek tamamlanmış kitap.",ch:[],p:[]}];
const ANN=["📣 Gece Yarısı Mührü’nün 2. bölümü yayında!","✨ Yıldız Tozu çok yakında kitaplıkta."];
let S={size:19,lh:1.8,serif:true},CM={},LK={},q="";
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>s.replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",2200)}
function home(){app.innerHTML=`<div class="hero"><div class="logo">✒️</div><h1 class="ser">Solyra</h1><p>Merhaba, ben Solyra. Burası hikâyelerimin yaşadığı yer. Kısa biyografim ve yazarlık anlayışım burada yer alacak.</p><div class="tags"><span>Fantastik</span><span>Macera</span><span>Dram</span></div></div>
<div class="w"><h2>Duyurular</h2>${ANN.map(a=>`<div class="card">${a}</div>`).join("")}
<h2>Kitaplarım</h2><div class="shelf">${B.map(b=>`<div class="bk" onclick="location.hash='book-${b.id}'"><div class="cover" style="background:linear-gradient(160deg,${b.c.split(",")[0]},${b.c.split(",")[1]})">${b.t}</div><small><span class="st">${b.s}</span> ${b.g}</small></div>`).join("")}</div>
<p style="text-align:center;margin-top:50px"><button class="btn" onclick="toast('Yönetici paneli sonraki aşamada eklenecek')">🔒 Yönetici girişi</button></p></div>`}
function book(id){const b=B.find(x=>x.id==id);app.innerHTML=`<div class="w"><button class="back" onclick="location.hash='home'">← Ana sayfa</button>
<div style="display:flex;gap:16px;align-items:flex-end"><div class="cover" style="width:120px;flex:none;background:linear-gradient(160deg,${b.c.split(",")[0]},${b.c.split(",")[1]})">${b.t}</div><div><h1 style="margin:0;font-size:36px">${b.t}</h1><span class="st">${b.s}</span> ${b.g}</div></div>
<p>${b.d}</p>${b.ch.length?`<h2>Karakterler</h2><div class="chars">${b.ch.map(c=>`<div class="fc" onclick="this.classList.toggle('on')"><div class="fi"><div class="fa" style="background:linear-gradient(160deg,${c.c.split(",")[0]},${c.c.split(",")[1]})"><i>${c.e}</i>${c.n}</div><div class="fb"><b>${c.n}</b><br>Yaş: ${c.a}<br>Kişilik: ${c.k}<br>Rol: ${c.r}</div></div></div>`).join("")}</div>`:""}
<h2>Bölümler</h2>${b.p.map((p,i)=>p.o?`<div class="card ch" onclick="location.hash='read-${id}-${i}'"><span class="n">${i+1}</span><span>${p.t}</span></div>`:"").join("")||"<p>Henüz bölüm yok.</p>"}</div>`}
function read(id,i){const b=B.find(x=>x.id==id),p=b.p[i],k=id+"-"+i;CM[k]=CM[k]||[];
const ff=S.serif?'"Cormorant Garamond",Georgia,serif':"Inter,sans-serif";
app.innerHTML=`<div class="w"><button class="back" onclick="location.hash='book-${id}'">← ${b.t}</button><h2 style="margin-top:6px">${i+1}. ${p.t}</h2>
<div class="bar"><button class="btn" onclick="st('size',-1)">A−</button><button class="btn" onclick="st('size',1)">A+</button><button class="btn" onclick="st('lh',.2)">Satır aralığı</button><button class="btn" onclick="st('f')">Yazı tipi</button><button class="btn" onclick="lk('${k}')">${LK[k]?"♥":"♡"} Beğen</button></div>
<div id="txt" style="font:${S.size}px/${S.lh} ${ff}">${p.x.map(t=>`<p>${t}</p>`).join("")}</div>
<p style="color:var(--mu);font-size:13px">💡 Bir cümleyi seç, o kısma özel yorum bırak.</p>
<h2>Yorumlar</h2><div id="cm">${CM[k].map(c=>`<div class="card"><div class="q">“${esc(c.q)}”</div>${esc(c.m)}</div>`).join("")||"<p style='color:var(--mu)'>İlk yorumu sen yaz.</p>"}</div></div>`;window.K=k}
function st(a,v){if(a=="f")S.serif=!S.serif;else if(a=="lh")S.lh=S.lh>=2.2?1.5:S.lh+v;else S.size=Math.min(30,Math.max(14,S.size+v));route()}
function lk(k){LK[k]=!LK[k];route()}
function route(){const h=location.hash.slice(1).split("-");window.scrollTo(0,0>1?0:window.scrollY);$("#sel").style.display="none";
if(h[0]=="book")book(h[1]);else if(h[0]=="read")read(h[1],+h[2]);else home()}
addEventListener("hashchange",()=>{window.scrollTo(0,0);route()});route();
document.addEventListener("selectionchange",()=>{const s=getSelection(),t=$("#txt");if(!t||s.isCollapsed||!t.contains(s.anchorNode))return;const x=s.toString().trim();if(x){q=x;$("#sq").textContent="“"+x.slice(0,140)+"”";$("#sel").style.display="block"}});
$("#sx").onclick=()=>$("#sel").style.display="none";
$("#sg").onclick=()=>{const m=$("#si").value.trim();if(!m||!q)return;CM[window.K].push({q,m});$("#si").value="";q="";const y=scrollY;route();scrollTo(0,y);toast("Yorum eklendi")};
</script></body></html>
